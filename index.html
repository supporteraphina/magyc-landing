<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>magyc.com | Coming soon</title>
  <meta name="description" content="magyc.com is coming soon. This domain is owned by Halevora Holdings Ltd. and is not for sale.">
  <meta name="theme-color" content="#08060b">
  <meta property="og:title" content="magyc.com | Coming soon">
  <meta property="og:description" content="This domain is owned by Halevora Holdings Ltd. and is not for sale.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://magyc.com/">
  <link rel="canonical" href="https://magyc.com/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/hero.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="/assets/fonts.css">
  <style>
    :root {
      --bg: #08060b;
      --text: #f0eee9;
      --text-dim: #a9a5ad;
      --text-faint: #726e78;
      --border: rgba(255, 255, 255, 0.09);
      --accent: #7d9bff;
      --scrim-blue-top: rgba(8, 10, 26, 0.55);
      --scrim-blue-mid: rgba(12, 22, 70, 0.55);
      --scrim-blue-bottom: rgba(5, 9, 28, 0.94);
      --glow-accent: rgba(96, 130, 255, 0.22);
      --gutter: clamp(16px, 4vw, 56px);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --sans: 'Hanken Grotesk', system-ui, sans-serif;
      --mono: 'Fragment Mono', ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16.5px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      isolation: isolate;
    }

    .stage__media {
      position: absolute;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    .stage__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 50%;
      filter: saturate(0.85);
      transform: scale(1.04);
      animation: settle 2.4s var(--ease-out) both;
    }

    .stage__media::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(60% 50% at 12% 78%, var(--glow-accent), transparent 70%),
        linear-gradient(180deg, var(--scrim-blue-top) 0%, var(--scrim-blue-mid) 45%, var(--scrim-blue-bottom) 100%);
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 68px;
      padding: 0 var(--gutter);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(8, 6, 11, 0.7), rgba(8, 6, 11, 0));
    }

    .wordmark {
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: 0.32em;
      font-size: 0.85rem;
    }

    .wordmark em {
      font-style: normal;
      color: var(--accent);
    }

    .bar__domain {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .hero {
      align-self: end;
      padding: clamp(48px, 10vh, 120px) var(--gutter) clamp(40px, 9vh, 104px);
      max-width: 1400px;
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 28px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: clamp(3.2rem, 12vw, 11rem);
      line-height: 0.88;
      text-wrap: balance;
    }

    .notice {
      margin: 0;
      max-width: 46ch;
      font-size: clamp(0.85rem, 1.1vw, 0.98rem);
      color: var(--text-dim);
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 24px;
      padding: 18px var(--gutter) 22px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .rise {
      animation: rise 1.1s var(--ease-out) both;
    }
    .rise--2 { animation-delay: 0.12s; }
    .rise--3 { animation-delay: 0.24s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes settle {
      from { opacity: 0; transform: scale(1.1); }
      to { opacity: 1; transform: scale(1.04); }
    }

    @media (max-width: 560px) {
      .bar__domain { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rise, .stage__media img { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="stage__media" aria-hidden="true">
      <img src="/assets/hero.webp" alt="" width="1536" height="1024" decoding="async" fetchpriority="high">
    </div>

    <header class="bar">
      <span class="wordmark">HALEVORA<em>.</em></span>
      <span class="bar__domain">magyc.com</span>
    </header>

    <main class="hero">
      <p class="eyebrow rise">magyc.com</p>
      <h1 class="rise rise--2">Coming soon</h1>
      <p class="notice rise rise--3">This domain is owned by Halevora Holdings Ltd. and is not for sale.</p>
    </main>

    <footer class="foot">
      <span>&copy; 2026 Halevora Holdings Ltd.</span>
      <span>All rights reserved</span>
    </footer>
  </div>
</body>
</html>
